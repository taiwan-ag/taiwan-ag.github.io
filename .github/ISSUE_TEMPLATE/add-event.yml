name: Add an event
description: Suggest an algebraic geometry event in Taiwan.
title: "[Event]: "
labels: ["add-event"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an event for the Taiwan Algebraic Geometry website.
        A maintainer will review your suggestion and add accepted events to the website.
  - type: input
    id: title
    attributes:
      label: Event title
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Event category
      description: |
        Choose meeting for a conference, workshop, minicourse, summer school, or similar program.
        Choose talk for an individual seminar talk, colloquium talk, or other standalone presentation.
        Classify the entry independently of its duration.
      multiple: false
      options:
        - meeting
        - talk
    validations:
      required: true
  - type: input
    id: institution
    attributes:
      label: Organizing institution
      description: Name the institution hosting or organizing the event.
    validations:
      required: true
  - type: checkboxes
    id: organized-by
    attributes:
      label: Organized at a different venue
      description: Leave unchecked if the event takes place on the institution's own campus.
      options:
        - label: This institution organizes the event at a different physical venue.
  - type: input
    id: start
    attributes:
      label: Start date
      description: Use YYYY-MM-DD.
      placeholder: "2026-11-05"
    validations:
      required: true
  - type: input
    id: end
    attributes:
      label: End date
      description: Use YYYY-MM-DD. Leave blank for a single-day event.
      placeholder: "2026-11-06"
    validations:
      required: false
  - type: input
    id: url
    attributes:
      label: Event homepage
      description: Optional URL for further details about the event.
      placeholder: "https://example.org/event"
    validations:
      required: false
