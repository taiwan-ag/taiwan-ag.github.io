# institution (the host), start (YYYY-MM-DD).
# Optional fields: institution_abbreviated (e.g. AS, NTU, NCTS),
# location (city or geographical region, without the institution),
# seminar (the recurring seminar's name), seminar_url (its website),
# url (link to the talk's info). Always keep the full institution name.
