# Algebraic geometry meetings in Taiwan: conferences, workshops,
# minicourses, schools, and similar programs. Use category: meeting.
# Required fields: title, category, institution, start (YYYY-MM-DD).
# Optional fields: end, location, url, organized_by.
# Individual seminar and colloquium talks belong in talks.yml.
# Meetings and talks are combined on the Events page, then sorted by
# _includes/events-list.html, based on end (or start, if no end) vs.
# the current date. Omit end for a single-day meeting.
# location is the physical city, region, or venue, displayed as
# "in [location]" after the institution.
# Omit url if the meeting has no homepage.
# organized_by: true renders "organized by [institution]" instead of
# "at [institution]" -- use for workshops run by a lab/institution at a
# different physical venue.

