<header>
  <div class="topbar">
    <button id="nav-toggle" class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>
    <a href="{{ '/' | relative_url }}" class="site-name">{{ site.short_title }}</a>
  </div>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
</header>

<nav id="site-nav" class="site-nav" aria-label="Main navigation">
  <div class="site-name sidebar-name">{{ site.short_title }}</div>
  <hr class="sidebar-divider">
  <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Upcoming Events</a>
  <a href="{{ '/past-events/' | relative_url }}"{% if page.url == '/past-events/' %} class="active"{% endif %}>Past Events</a>
  <a href="{{ '/people/' | relative_url }}"{% if page.url == '/people/' %} class="active"{% endif %}>People</a>
  <a href="{{ '/job-opportunities/' | relative_url }}"{% if page.url == '/job-opportunities/' %} class="active"{% endif %}>Job Opportunities</a>
  <a href="{{ '/get-in-touch/' | relative_url }}"{% if page.url == '/get-in-touch/' %} class="active"{% endif %}>Get in Touch</a>
</nav>

<div id="nav-backdrop" class="nav-backdrop" hidden></div>
