<header class="site-header">

    <span class="nav-toggle-bar"></span>
    <span class="nav-toggle-bar"></span>
    <span class="nav-toggle-bar"></span>
  </button>

    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Activities</a>
