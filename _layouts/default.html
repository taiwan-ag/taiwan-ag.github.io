<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ site.title }} — {{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script src="{{ '/assets/js/info-toggle.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/nav-toggle.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/people-filter.js' | relative_url }}" defer></script>
</head>
<body>
  {% include header.html %}
  <div class="page-wrap">
    <main class="page-content">
      {{ content }}
    </main>
  </div>
  <div class="last-updated-bar">
    <p class="last-updated">Last updated in {{ site.time | date: "%B %Y" }}</p>
  </div>
</body>
</html>
